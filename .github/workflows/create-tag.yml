name: Tag Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    # Three conditions must all be true:
    # 1. The PR was merged, not just closed
    # 2. It carries the release label
    # 3. The branch follows the release/* pattern
    if: |
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release') &&
      startsWith(github.event.pull_request.head.ref, 'release/')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout main at merge commit
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Parse tag from branch name
        id: vars
        run: |
          # Strips the release/ prefix from the branch name to get the tag
          # e.g. release/service-v1.2.3 → service-v1.2.3
          BRANCH="${{ github.event.pull_request.head.ref }}"
          TAG="${BRANCH#release/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Creating tag: $TAG"

      - name: Create and push tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.vars.outputs.tag }}"
          git push origin "${{ steps.vars.outputs.tag }}"
          echo "✅ Tagged main at: ${{ steps.vars.outputs.tag }}"
