name: Publish Artifacts

on:
  push:
    tags:
      - "*-v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6

      - name: Extract service and version from tag
        id: vars
        run: |
          # Splits tag into service name and version
          # e.g. service-v1.2.3 → service=service, version=1.2.3
          TAG="${GITHUB_REF#refs/tags/}"
          SERVICE="${TAG%-v*}"
          VERSION="${TAG#*-v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          test -d "services/$SERVICE" || {
            echo "❌ services/$SERVICE not found for tag $TAG"
            exit 1
          }

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ steps.vars.outputs.service }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ steps.vars.outputs.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "${{ steps.vars.outputs.service }} v${{ steps.vars.outputs.version }}"
          body_path: services/${{ steps.vars.outputs.service }}/CHANGELOG.md
          draft: false
          prerelease: false

      - name: Summary
        run: |
          echo "✅ ${{ steps.vars.outputs.service }} v${{ steps.vars.outputs.version }} published"
          echo "🐳 ghcr.io/${{ github.repository_owner }}/${{ steps.vars.outputs.service }}:${{ steps.vars.outputs.version }}"
