name: Publish Artifacts

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  build-and-publish:
    if: |
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release') &&
      startsWith(github.event.pull_request.head.ref, 'release/')

    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout main at merge commit
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Extract service and version from branch name
        id: vars
        run: |
          # release/service-v1.2.3 → service=service, version=1.2.3
          BRANCH="${{ github.event.pull_request.head.ref }}"
          TAG="${BRANCH#release/}"
          SERVICE="${TAG%-v*}"
          VERSION="${TAG#*-v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          test -d "services/$SERVICE" || {
            echo "❌ services/$SERVICE not found"
            exit 1
          }

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ steps.vars.outputs.service }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: services/${{ steps.vars.outputs.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "${{ steps.vars.outputs.service }} v${{ steps.vars.outputs.version }}"
          body_path: services/${{ steps.vars.outputs.service }}/CHANGELOG.md
          draft: false
          prerelease: false

      - name: Summary
        run: |
          echo "✅ ${{ steps.vars.outputs.service }} v${{ steps.vars.outputs.version }} published"
          echo "🐳 ghcr.io/${{ github.repository_owner }}/${{ steps.vars.outputs.service }}:${{ steps.vars.outputs.version }}"
