name: Terraform Dev

on:
  pull_request:
    paths:
      - "infra/environments/dev/**"
      - "infra/modules/**"
  push:
    branches:
      - main
    paths:
      - "infra/environments/dev/**"
      - "infra/modules/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TF_VERSION: "1.14.5"
  TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/environments/dev

    steps:
      - uses: actions/checkout@v7

      - run: mkdir -p $TF_PLUGIN_CACHE_DIR

      - uses: actions/cache@v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/environments/dev/.terraform.lock.hcl') }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::813554192815:role/github-oidc-dev
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-dev

      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform fmt -check -recursive

      - run: terraform plan -input=false -lock-timeout=10m -out=tfplan

      - uses: actions/upload-artifact@v7
        with:
          name: dev-tfplan
          path: infra/environments/dev/tfplan
          retention-days: 5

  apply:
    if: github.event_name != 'pull_request'
    needs: plan
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infra/environments/dev

    steps:
      - uses: actions/checkout@v7

      - run: mkdir -p $TF_PLUGIN_CACHE_DIR

      - uses: actions/cache@v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/environments/dev/.terraform.lock.hcl') }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::813554192815:role/github-oidc-dev
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-dev-apply

      - run: terraform init -input=false -reconfigure

      - uses: actions/download-artifact@v8
        with:
          name: dev-tfplan
          path: infra/environments/dev

      - run: terraform show tfplan
      - run: terraform apply -input=false -lock-timeout=10m tfplan
