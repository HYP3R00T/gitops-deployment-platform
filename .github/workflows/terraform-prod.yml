name: Terraform Prod

on:
  # pull_request:
  #   paths:
  #     - "infra/environments/prod/**"
  #     - "infra/modules/**"
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "infra/environments/prod/**"
  #     - "infra/modules/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TF_VERSION: "1.14.5"
  TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/environments/prod

    steps:
      - uses: actions/checkout@v6
      - run: mkdir -p $TF_PLUGIN_CACHE_DIR

      - uses: actions/cache@v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/environments/prod/.terraform.lock.hcl') }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::813554192815:role/github-oidc-prod
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-prod

      - run: terraform init -input=false -reconfigure
      - run: terraform validate
      - run: terraform fmt -check -recursive
      - run: terraform plan -input=false -lock-timeout=10m -out=tfplan

      - uses: actions/upload-artifact@v7
        with:
          name: prod-tfplan
          path: infra/environments/prod/tfplan
          retention-days: 30

  apply:
    if: github.event_name != 'pull_request'
    needs: plan
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: infra/environments/prod

    steps:
      - uses: actions/checkout@v6
      - run: mkdir -p $TF_PLUGIN_CACHE_DIR

      - uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/environments/prod/.terraform.lock.hcl') }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::813554192815:role/github-oidc-prod
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-prod-apply

      - run: terraform init -input=false -reconfigure

      - uses: actions/download-artifact@v4
        with:
          name: prod-tfplan
          path: infra/environments/prod

      - run: terraform show tfplan
      - run: terraform apply -input=false -lock-timeout=10m tfplan
