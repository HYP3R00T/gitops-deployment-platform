---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: platform-web
  labels:
    app: web
    version: v1
    managed-by: gitops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
      version: v1
  template:
    metadata:
      labels:
        app: web
        version: v1
    spec:
      containers:
        - name: web
          image: platform-web:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 4321
              protocol: TCP
          env:
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: HOST
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: NODE_ENV
            - name: PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: PUBLIC_API_URL
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
