services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: api:latest
    container_name: platform-api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=info
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - platform-network

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
      args:
        PUBLIC_API_URL: http://api:8000
    image: web:latest
    container_name: platform-web
    ports:
      - "4321:4321"
    environment:
      - HOST=0.0.0.0
      - PORT=4321
      - NODE_ENV=production
      - PUBLIC_API_URL=http://api:8000
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:4321",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - platform-network

networks:
  platform-network:
    driver: bridge
